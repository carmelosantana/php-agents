name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, xml
          tools: composer:v2.9.8
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify tracked local artifacts are absent
        run: |
          tracked_artifacts="$(git ls-files -- '.env' '.env.*' '.llama-cpp*.env' '*.log' 'benchmark_output*.txt' 'cache_benchmark_output*.json' 'raw_compare_output*.json')"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Tracked local/runtime artifacts are not allowed:" >&2
            echo "$tracked_artifacts" >&2
            exit 1
          fi

      - name: Run tests
        run: composer test

      - name: Verify tracked worktree stays clean
        run: |
          if [[ -n "$(git status --short --untracked-files=no)" ]]; then
            git status --short --untracked-files=no
            exit 1
          fi

  static-analysis:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, xml
          tools: composer:v2.9.8
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify tracked local artifacts are absent
        run: |
          tracked_artifacts="$(git ls-files -- '.env' '.env.*' '.llama-cpp*.env' '*.log' 'benchmark_output*.txt' 'cache_benchmark_output*.json' 'raw_compare_output*.json')"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Tracked local/runtime artifacts are not allowed:" >&2
            echo "$tracked_artifacts" >&2
            exit 1
          fi

      - name: Run PHPStan
        run: composer analyse

      - name: Verify tracked worktree stays clean
        run: |
          if [[ -n "$(git status --short --untracked-files=no)" ]]; then
            git status --short --untracked-files=no
            exit 1
          fi
