name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests (PHP 8.4)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, xml
          tools: composer:v2.9.8
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test

      - name: Run PHPStan
        run: composer analyse

  build:
    name: Build release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, xml
          tools: composer:v2.9.8
          coverage: none

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-release-8.4-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-release-8.4-

      - name: Export clean source
        run: |
          mkdir -p BUILD/php-agents
          git archive HEAD | tar -x -C BUILD/php-agents

      - name: Install production dependencies
        working-directory: BUILD/php-agents
        run: |
          composer install \
            --no-dev \
            --classmap-authoritative \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --optimize-autoloader

      - name: Strip vendor bloat
        working-directory: BUILD/php-agents
        run: |
          # Git metadata
          find vendor/ -type d -name '.git' -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -type f -name '.gitignore' -delete 2>/dev/null || true
          find vendor/ -type f -name '.gitattributes' -delete 2>/dev/null || true

          # Test directories
          find vendor/ -type d -name 'tests' -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -type d -name 'Tests' -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -type d -name 'test' -exec rm -rf {} + 2>/dev/null || true

          # CI / dev config
          find vendor/ -type f \( \
            -name 'phpunit.xml*' -o \
            -name 'phpstan.neon*' -o \
            -name '.php-cs-fixer*' -o \
            -name '.editorconfig' -o \
            -name '.travis.yml' -o \
            -name '.scrutinizer.yml' -o \
            -name 'Makefile' \
          \) -delete 2>/dev/null || true

          # Non-essential markdown
          find vendor/ -type f -name '*.md' \
            ! -name 'README.md' \
            ! -name 'LICENSE*' \
            ! -name 'LICENCE*' \
            -delete 2>/dev/null || true

          # Doc directories
          find vendor/ -type d \( -name 'docs' -o -name 'doc' \) -exec rm -rf {} + 2>/dev/null || true

          # Empty dirs
          find vendor/ -type d -empty -delete 2>/dev/null || true

          # Final cleanup
          rm -f .gitattributes .gitignore
          rm -rf .github/ 2>/dev/null || true

      - name: Verify build
        working-directory: BUILD/php-agents
        run: |
          echo "--- Autoloader check ---"
          php -r "require 'vendor/autoload.php'; echo 'Autoloader OK' . PHP_EOL;"
          echo ""
          echo "--- File count ---"
          find . -type f | wc -l
          echo ""
          echo "--- Top-level contents ---"
          ls -la

      - name: Create archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_BASE="php-agents-v${VERSION}"
          mkdir -p BUILD/dist

          # ZIP
          cd BUILD
          zip -qr "dist/${ARTIFACT_BASE}.zip" php-agents/
          cd ..

          # tar.gz
          cd BUILD
          tar -czf "dist/${ARTIFACT_BASE}.tar.gz" php-agents/
          cd ..

          # SHA-256 checksums
          cd BUILD/dist
          sha256sum "${ARTIFACT_BASE}.zip" > "${ARTIFACT_BASE}.zip.sha256"
          sha256sum "${ARTIFACT_BASE}.tar.gz" > "${ARTIFACT_BASE}.tar.gz.sha256"
          cd ../..

          echo "--- Artifacts ---"
          ls -lh BUILD/dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: BUILD/dist/
          retention-days: 5

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
